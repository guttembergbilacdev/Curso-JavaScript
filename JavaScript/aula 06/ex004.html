<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Document</title>
        
    <style>
    body {
        font: font arial 20pt;
        background-color: rgb(51, 206, 121);
    }
    </style>
       
</head>
<body><script>
    var nome = window.prompt("qual é o seu nome?");// vai seu nome
    document.write(`<br> Olá, <strong>${nome}</strong> seu nome tem: ` + nome.length + " caracteres"); // concatenanção a variável nome com a string
    document.write(`<br> seu nome em minusculo: ` + nome.toLowerCase()); // concatenanção a variável nome com a string
    document.write(`<br> seu nome em maiusculo: ` + nome.toUpperCase()); // concatenanção a variável nome com a string
</script>
</body>
</html>
