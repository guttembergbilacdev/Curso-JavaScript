<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Verificador de Voto</title>
</head>
<body>

    <h1>Verificador de Obrigatoriedade de Voto</h1>

    <label for="idade">Digite sua idade:</label>
    <input type="number" id="idade" placeholder="Ex: 71">
    <button onclick="verificarVoto()">Verificar</button>

    <p id="resultado"></p>
<script>
function verificarVoto() {
            // pega o valor digitado e converte para número
            var idade = Number(document.getElementById("idade").value);
            var resultado = document.getElementById("resultado");

            if (idade < 16) {
                resultado.textContent = "Idade menor que 16: voto proibido";
            } else if (idade >= 16 && idade < 18) {
                resultado.textContent = "Idade entre 16 e 18: voto facultativo";
            } else if (idade >= 18 && idade <= 70) {
                resultado.textContent = "Idade entre 18 e 70: voto obrigatório";
            } else {
                resultado.textContent = "Idade maior que 70: voto facultativo";
            }
        }
    </script>

</body>
</html>
