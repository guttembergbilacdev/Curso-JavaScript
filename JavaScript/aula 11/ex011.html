<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>País de Origem</title>
</head>
<body>
    <h1>País de Origem</h1>
    <p>Informe o país de origem:</p>
    <input type="text" id="txtorigem" placeholder="País de origem">
    <button onclick="VerificarOrigem()">Verificar</button>
    <div id="res"></div>

    <script>
        function VerificarOrigem() {
            var txtorigem = document.getElementById('txtorigem');
            var res = document.getElementById('res');
            var origem = txtorigem.value;

            res.innerHTML = `<p>O país de origem é: <strong>${origem}<strong></p>`;
            if (origem.toLowerCase() === 'brasil') {
                res.innerHTML += '<p><strong>Você é brasileiro!<strong></p>';
            } else {
                res.innerHTML += '<p><strong>Você não é brasileiro.<strong></p>';
            }
        }
    </script>
</body>
</html>
