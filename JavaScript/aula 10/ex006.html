<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento DOM</title>
        <style>
            div#area {
               background-color: hwb(140 5% 47%);
                color: white;
                width: 200px;
                height: 200px;
                line-height: 200px;
                text-align: center;
                font-family: Arial, sans-serif;
                font-size: 20px;  
            }
        </style>
</head>
<body>
    <div id="area";>
            Interaja...
    </div>
    <script>
        var a = window.document.getElementById("area");
            a.addEventListener("click", clicar);
            a.addEventListener("mouseenter", entrar);
            a.addEventListener("mouseout", sair);
            
        function clicar() {
           a.innerText = "clicou";
           a.style.backgroundColor = "red";
        }
        function entrar() {
           a.innerText = "entrou";
        }
        function sair() {
           a.innerText = "saiu";
           a.style.backgroundColor = "green";
        }
    </script>

</body>
</html>
